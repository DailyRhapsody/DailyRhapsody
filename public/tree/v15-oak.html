<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>思维大树 · 真实数据预览</title>
<style>
  html,body{height:100%;margin:0;background:#070503;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;}
  #wrap{position:relative;width:100%;height:100vh;height:100dvh;max-width:none;margin:0;}
  #stage{position:absolute;inset:0;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.drag{cursor:grabbing;}
  .ctrl{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
    width:auto;max-width:calc(100% - 32px);box-sizing:border-box;padding:8px 14px;
    color:#c9a45c;font-size:11px;letter-spacing:.06em;background:rgba(8,6,4,.62);
    border:1px solid rgba(201,164,92,.28);border-radius:999px;backdrop-filter:blur(5px);z-index:3;}
  .ctrl input[type=range]{width:clamp(110px,26vw,260px);accent-color:#c9a45c;}
  .ctrl button{background:none;border:1px solid #6d5830;color:#c9a45c;border-radius:2px;
    padding:3px 9px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .ctrl button.on{background:rgba(201,164,92,.18);border-color:#c9a45c;}
  .ctrl #nv{min-width:34px;display:inline-block;text-align:right;}
  @media (max-width:700px){
    .ctrl{gap:6px;font-size:10px;padding:7px 10px;bottom:14px}.ctrl button{font-size:10px;padding:3px 7px}
  }

  #tip{position:absolute;left:0;top:0;z-index:8;max-width:min(300px,70vw);pointer-events:none;
    padding:10px 13px 11px;border:1px solid rgba(225,190,122,.42);border-radius:4px;
    background:linear-gradient(145deg,rgba(32,25,14,.96),rgba(10,8,5,.94));
    box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px rgba(255,235,185,.12);
    color:#f0d9a0;opacity:0;transform:translate(-50%,-118%);transition:opacity .12s ease;white-space:normal;}
  #tip.show{opacity:1;}
  #tip b{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;}
  #tip span{display:block;margin-top:4px;color:#bda373;font-size:11px;line-height:1.55;}
  #reader{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    padding:24px;background:rgba(3,2,1,.72);backdrop-filter:blur(7px);}
  #reader.open{display:flex;}
  .reader-card{position:relative;width:min(720px,100%);max-height:min(82vh,760px);overflow:auto;
    padding:34px 38px 38px;border:1px solid rgba(225,190,122,.28);border-radius:5px;
    background:linear-gradient(155deg,rgba(30,24,14,.98),rgba(13,10,6,.98));
    box-shadow:0 30px 90px rgba(0,0,0,.65);color:#e8d3a3;}
  .reader-card:before{content:"";position:absolute;inset:8px;border:1px solid rgba(225,190,122,.09);pointer-events:none;}
  .reader-meta{color:#a98c55;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
  .reader-title{margin:12px 0 22px;font-size:24px;font-weight:300;color:#f3dfb1;line-height:1.35;}
  .reader-body{white-space:pre-wrap;font-size:14px;line-height:1.9;color:#d7c18f;}
  .reader-actions{display:flex;gap:14px;align-items:center;margin-top:26px;padding-top:16px;
    border-top:1px solid rgba(225,190,122,.16);font-size:11px;}
  .reader-actions a{color:#d7b86e;text-decoration:none;border-bottom:1px solid rgba(215,184,110,.35);}
  .reader-close{position:absolute;right:14px;top:12px;width:34px;height:34px;border:0;background:none;
    color:#bfa064;font-size:24px;line-height:1;cursor:pointer;}
  .reader-close:hover{color:#fff0c5;}
  @media (max-width:600px){#reader{padding:10px}.reader-card{padding:28px 20px 26px;max-height:88vh}.reader-title{font-size:20px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="1160" height="680"></canvas>
    <div id="tip" role="status"></div>
  </div>
  <div class="ctrl">
    <span>博客</span><input id="n" type="range" min="1" max="228" step="1" value="228" aria-label="博客数量"><span id="nv">228</span>
    <button id="play">▶ 生长回放</button>
  </div>
</div>
<div id="reader" aria-hidden="true">
  <article class="reader-card" role="dialog" aria-modal="true" aria-label="文章内容">
    <button class="reader-close" type="button" aria-label="关闭文章">×</button>
    <div class="reader-meta" id="reader-meta"></div>
    <h2 class="reader-title" id="reader-title"></h2>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-actions"><a id="reader-link" href="/blog">在博客中打开</a><span>按 Esc 关闭</span></div>
  </article>
</div>
<script>
window.addEventListener('error', e => { document.title = 'ERR: ' + e.message + ' @' + e.lineno + ':' + e.colno; });
const Q = new URLSearchParams(location.search);
const STATIC = Q.get('static') === '1';

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1160, H = 680;

/* ---------------- 基础工具 ---------------- */
const rad = d => d * Math.PI / 180;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const frac = x => x - Math.floor(x);
const GA = rad(137.508);                       // 黄金角：新枝自动落进空隙
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
const R1 = k => mulberry32(hashStr(k))();      // 以名字为种子：同一根枝永远同一个随机数
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const sub3=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len3=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len3(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

/* ---------------- 数据：来自 /api/tree 的真实公开博客 ---------------- */
let TREE_EPOCH = 2021 * 12 + 3;

function notesFromTree(tree){
  const notes = [];
  (tree.families || []).forEach(f => (f.topics || []).forEach(tp => (tp.entries || []).forEach(e => {
    notes.push({
      fam: f.name,
      topic: tp.name,
      sub: e.sub,
      t: Number(e.t) || 0,
      date: e.date,
      entryId: String(e.id),
      id: 'entry|' + e.id,
    });
  })));
  notes.sort((a, b) => a.t - b.t || a.id.localeCompare(b.id));
  notes.forEach((nt, i) => nt.idx = i);
  return notes;
}
function monthLabel(t){
  const m0 = TREE_EPOCH + Math.floor(t);
  return `${Math.floor(m0 / 12)}-${String(m0 % 12 + 1).padStart(2, '0')}`;
}

/* ---------------- 几何 ---------------- */
function growPts(p0, d0, L, bend, key, n, wig, curl){
  wig = wig == null ? 0.12 : wig;
  const r = mulberry32(hashStr(key));
  const phase = R1('ph' + key) * Math.PI * 2;
  const pts = [p0]; let d = norm(d0), p = p0;
  const seg = L / n;
  for (let i = 0; i < n; i++) {
    const t = i / n;
    // 自然枝不是折线：越靠近枝梢越向上拱，侧向用低频 S 弯，噪声只做纤维感
    const lift = (bend || 0) * (0.35 + 0.9 * t) / n;
    const sway = 0;
    d = norm(add(d, [(r() - .5) * wig * 0.42 / Math.sqrt(n) + sway, lift,
                     (r() - .5) * wig * 0.42 / Math.sqrt(n) + sway * 0.35]));
    p = add(p, mul(d, seg)); pts.push(p);
  }
  // 扭曲感：沿枝长做一次收口的 S 弯，端点和枝尖仍在原方向，不改变整体向上
  if (curl) {
    const amp = Math.abs(curl) * Math.min(1, L / 2.4);
    for (let i = 1; i < n; i++) {
      const t = i / n;
      const tan = norm(sub3(pts[Math.min(n, i + 1)], pts[Math.max(0, i - 1)]));
      const nx = -tan[2], nz = tan[0], nl = Math.hypot(nx, nz) || 1;
      const off = Math.sin(t * Math.PI * 2.2 + phase) * Math.sin(t * Math.PI) * amp;
      pts[i] = add(pts[i], [nx / nl * off, 0, nz / nl * off]);
    }
  }
  return pts;
}
function ptAt(pts, t){
  const x = clamp(t, 0, 1) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(x)), f = x - i;
  return [pts[i][0]*(1-f)+pts[i+1][0]*f, pts[i][1]*(1-f)+pts[i+1][1]*f, pts[i][2]*(1-f)+pts[i+1][2]*f];
}
function tanAt(pts, t){
  const x = clamp(t, 0, 1) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(x));
  return norm(sub3(pts[i + 1], pts[i]));
}
/* 从父枝切线 T 偏转出侧枝：phi=绕父枝的方位，alpha=张开角 */
function lateral(T, phi, alpha){
  let u = cross(T, [0, 1, 0]); if (len3(u) < 1e-3) u = [1, 0, 0]; u = norm(u);
  const v = norm(cross(T, u));
  const p = add(mul(u, Math.cos(phi)), mul(v, Math.sin(phi)));
  return norm(add(mul(T, Math.cos(alpha)), mul(p, Math.sin(alpha))));
}

/* ---------------- 成长型生成器 ----------------
   输入：按时间排序的博客 + 当前进度 nF（第几篇）
   规则：
   · 树高 ∝ N^0.33；枝长 ∝ 枝下博客数^(1/3)；枝粗 ∝ √枝下博客数（管道模型）
   · 每 3 篇博客长 1 根细枝；主枝每 9 篇、中类枝每 7 篇长 1 根短枝
   · 方位按「创建先后 × 黄金角」+ 名字哈希：老枝不挪位，新枝落进空隙
   · 每篇博客 1 片叶，挂在自己细类的枝系上，各级都有 */
const KR = 0.026;
function generate(notes, nF){
  const take = Math.max(1, Math.min(notes.length, Math.ceil(nF)));
  const cur = notes.slice(0, take);
  const N = cur.length;
  const S = Math.max(0.2, Math.pow(N / 228, 0.33));
  const TH = 9.5 * S;
  const R = mulberry32(hashStr('annual-oak-' + N));
  const branches = [], leaves = [], roots = [];
  const mk = (pts, level, m, key, extra) => Object.assign({pts, level, r: KR * Math.pow(Math.max(1, m), 0.58), key, used: 0}, extra || {});
  const parentMap = new Map();

  const trunk = mk(growPts([0, 0, 0], [.025, 1, .012], TH * .10, .04, 'trunk', 14, .02, .03), 1, N, 'trunk', {});
  branches.push(trunk);
  parentMap.set('trunk', null);
  let active = [{b: trunk, dir: tanAt(trunk.pts, 1), order: 1, az: 0}];

  const appendShoot = (b, dir, len, order, bend, keySeed) => {
    const p0 = b.pts[b.pts.length - 1];
    const pts = growPts(p0, dir, len, bend, keySeed, order <= 2 ? 8 : 6, .075, (R() - .5) * .55);
    b.pts.push(...pts.slice(1));
    b.dir = tanAt(b.pts, 1);
    return pts[pts.length - 1];
  };

  const childShoot = (parent, base, dir, len, order, key, bend) => {
    const pts = growPts(base, dir, len, bend, key, order <= 2 ? 8 : 6, .07, (R() - .5) * .45);
    const b = mk(pts, order, 1, key, {parent: parent.key});
    branches.push(b);
    parentMap.set(key, parent.key);
    return b;
  };

  const totalYears = 28;
  const years = Math.max(5, Math.round(totalYears * take / notes.length));
  let scaffoldCount = 0;

  for (let year = 1; year <= years; year++) {
    const next = [];
    for (const tip of active) {
      const b = tip.b;
      const canGrow = true;
      if (canGrow) {
        const baseLen = tip.order === 1 ? TH * .028
          : tip.order === 2 ? TH * .038
          : tip.order === 3 ? TH * .030
          : tip.order === 4 ? TH * .022 : TH * .015;
        const len = baseLen * (.86 + .28 * R()) * (1 - .012 * year);
        const tropism = tip.order === 1 ? .018 : tip.order === 2 ? .010 : tip.order === 3 ? .008 : .004;
        const outward = tip.order === 2 ? .025 : tip.order === 3 ? .014 : .005;
        const radial = [Math.cos(tip.az || 0) * outward, 0, Math.sin(tip.az || 0) * outward];
        const drift = (tip.order >= 4 ? -.005 : 0) + (R() - .5) * .08;
        const dir = norm(add(add(tip.dir, [(R() - .5) * .09, tropism + drift, (R() - .5) * .09]), radial));
        appendShoot(b, dir, len, tip.order, tip.order <= 2 ? .08 : .03, 'ext-' + b.key + '-' + year);
        tip.dir = tanAt(b.pts, 1);
        next.push(tip);
      }

      let spawn = 0;
      if (tip.order === 1) {
        if (year >= 4 && year <= 11 && scaffoldCount < 5) spawn = 1;
      } else if (tip.order === 2) {
        if (year >= 3 && R() < .34) spawn = 1;
      } else if (tip.order === 3) {
        if (R() < .25) spawn = 1;
      } else if (R() < .14) spawn = 1;

      for (let k = 0; k < spawn; k++) {
        const t = .30 + .58 * R();
        const base = ptAt(b.pts, t);
        const alpha = rad(tip.order === 1 ? 44 + 18 * R()
          : tip.order === 2 ? 42 + 22 * R()
          : tip.order === 3 ? 50 + 24 * R() : 58 + 26 * R());
        const phi = k * GA + (R() - .5) * 1.6 + year * .37;
        const dir = lateral(tanAt(b.pts, t), phi, alpha);
        const len = tip.order === 1 ? TH * .050 : tip.order === 2 ? TH * .035 : TH * .022;
        const child = childShoot(b, base, dir, len * (.85 + .3 * R()), tip.order + 1,
                                 'lat-' + b.key + '-' + year + '-' + k, tip.order <= 2 ? .05 : -.02);
        const cdir = tanAt(child.pts, 1);
        next.push({b: child, dir: cdir, order: tip.order + 1, az: Math.atan2(cdir[2], cdir[0])});
        if (tip.order === 1) scaffoldCount++;
      }
    }
    active = next;
  }

  // 终端枝上挂叶；每篇博客 1 片叶，一篇不丢
  const carriers = active.length ? active : branches.filter(b => b.level >= 3).slice(-80).map(b => ({b, order: b.level}));
  for (let i = 0; i < N; i++) {
    const carrier = carriers[i % carriers.length].b;
    const t = .28 + .64 * R();
    const base = ptAt(carrier.pts, t);
    const T = tanAt(carrier.pts, t);
    let o = [R() - .5, R() - .5, R() - .5];
    o = norm(sub3(o, mul(T, dot(o, T))));
    const p = add(base, mul(o, .035 + .13 * R()));
    carrier.used++;
    leaves.push({p, a: 1, lvl: Math.min(5, carrier.level + 1), ang: R() * Math.PI, sz: .72 + .5 * R(), nt: cur[i], ck: carrier.key});
  }

  // 管道模型：按枝下叶量回算半径
  const desc = new Map();
  leaves.forEach(l => {
    let k = l.ck;
    while (k) { desc.set(k, (desc.get(k) || 0) + 1); k = parentMap.get(k); }
  });
  branches.forEach(b => { b.r = Math.max(.012, KR * Math.pow(Math.max(1, desc.get(b.key) || 0), .58)); });
  trunk.used = N;

  // 根系：主根 + 不等长水平根 + 侧根
  const tap = growPts([0, 0, 0], [.035, -1, .02], TH * .34, -.04, 'taproot', 14, .08, .10);
  roots.push({pts: tap, r: KR * Math.pow(N, .58) * .30, level: 0});
  const rootAz = [10, 51, 96, 143, 197, 238, 286, 329];
  const rootLen = [1.12, .52, .92, .38, 1.24, .44, .82, .34];
  for (let i = 0; i < rootAz.length; i++) {
    const az = rad(rootAz[i] + (R() - .5) * 22);
    const p0 = ptAt(tap, .16 + .12 * R());
    const L = (rootLen[i] + R() * .2) * S;
    roots.push({
      pts: growPts(p0, [Math.cos(az) * .96, -.10 - .08 * R(), Math.sin(az) * .96],
                   L, -.12 - .08 * R(), 'root' + i, 8, .10, (R() - .5) * .6),
      r: (i === 4 ? .22 : .15) * S, level: 0,
    });
    if (i % 2 === 0) {
      const q = ptAt(roots[roots.length - 1].pts, .45 + .15 * R());
      roots.push({
        pts: growPts(q, [Math.cos(az + .6 * (R() - .5)) * .94, -.16, Math.sin(az + .6 * (R() - .5)) * .94],
                     (.22 + .3 * R()) * S, -.12, 'rootlet' + i, 5, .1, .2),
        r: .055 * S, level: 0,
      });
    }
  }

  const lv = {2: 0, 3: 0, 4: 0, 5: 0};
  leaves.forEach(l => lv[Math.min(5, Math.max(2, l.lvl))]++);
  const stats = {
    N, S, TH, fams: new Set(cur.map(n => n.fam)).size,
    limbs: branches.filter(b => b.level === 2).length,
    topics: new Set(cur.map(n => n.topic)).size,
    topicBranches: branches.filter(b => b.level === 3).length,
    subs: branches.filter(b => b.level === 4).length,
    twigs: branches.filter(b => b.level === 5).length, spurs: 0,
    twigsWithLeaf: branches.filter(b => b.level === 5 && b.used > 0).length, lv,
  };
  let cx = 0, cz = 0; leaves.forEach(l => { cx += l.p[0]; cz += l.p[2]; });
  const pivot = [leaves.length ? cx / leaves.length * .8 : 0, 0, leaves.length ? cz / leaves.length * .8 : 0];
  return {branches, roots, leaves, stats, pivot, lastT: cur[cur.length - 1].t, lastDate: cur[cur.length - 1].date};
}

/* ---------------- 相机与投影 ---------------- */
const F = 1050;
let cam = {yaw: rad(-20), pitch: rad(8), dist: 21};
if (Q.get('yaw')) cam.yaw = rad(+Q.get('yaw'));
const home = () => ({yaw: rad(-20), pitch: rad(8), dist: 21});
let view = {v: 1, target: 1};
function project(p){
  const D = cam.dist * view.v, ty = (G ? G.stats.TH * 0.50 : 5) ;
  const pv = G && G.pivot ? G.pivot : [0, 0, 0];
  const x = p[0] - pv[0], y = p[1] - ty, z = p[2] - pv[2];
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const zc = z2 + D;
  const f = F / Math.max(2, zc);
  return {x: W / 2 + x1 * f, y: H * 0.43 - y1 * f, z: zc, f};
}
function depthA(z){ const D = cam.dist * view.v; return clamp(1.3 - (z - 0.7 * D) / (1.3 * D), .3, 1); }

/* ---------------- 绘制 ---------------- */
const halo = document.createElement('canvas'); halo.width = halo.height = 128;
{ const h = halo.getContext('2d'); const g = h.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,228,160,.8)'); g.addColorStop(.3, 'rgba(236,196,120,.28)');
  g.addColorStop(.65, 'rgba(190,148,80,.06)'); g.addColorStop(1, 'rgba(180,140,70,0)');
  h.fillStyle = g; h.fillRect(0, 0, 128, 128); }

function strokeBranch(P, r, level, aBase, seed){
  const strands = level <= 1 ? 3 : 1;
  const n = P.length;
  const widths = [], normals = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    widths.push(Math.max(.32, r * P[i].f * 1.15 * (1 - (level <= 1 ? .82 : .86) * t)));
    const j = Math.min(n - 1, i + 1), k = Math.max(0, i - 1);
    const nx = -(P[j].y - P[k].y), ny = P[j].x - P[k].x, nl = Math.hypot(nx, ny) || 1;
    normals.push([nx / nl, ny / nl]);
  }
  for (let s = 0; s < strands; s++) {
    for (let i = 1; i < n; i++) {
      const t = (i - .5) / (n - 1);
      const w = (widths[i - 1] + widths[i]) / 2;
      const off = (strands === 1 ? 0 : (s / (strands - 1) - .5)) * w * .55;
      const jit = Math.sin(t * 7 + s * 1.7 + seed) * w * .025;
      const x0 = P[i - 1].x + normals[i - 1][0] * (off + jit);
      const y0 = P[i - 1].y + normals[i - 1][1] * (off + jit);
      const x1 = P[i].x + normals[i][0] * (off + jit);
      const y1 = P[i].y + normals[i][1] * (off + jit);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
      const lineW = level <= 1 ? Math.max(.45, w / 3.2) : Math.max(.32, w * (level === 2 ? .62 : level === 3 ? .72 : .8));
      const branchAlpha = level >= 5 ? .46 : level === 4 ? .56 : .72;
      ctx.strokeStyle = level <= 1
        ? `rgba(201,164,92,${(.55 * aBase).toFixed(3)})`

/* 根系用有收分的实体根，不再是三根细线 */
function strokeRoot(P, r, aBase){
  const n = P.length, left = [], right = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const w = Math.max(.8, r * P[i].f * .15 * (1 - .72 * t));
    const j = Math.min(n - 1, i + 1), k = Math.max(0, i - 1);
    const nx = -(P[j].y - P[k].y), ny = P[j].x - P[k].x, nl = Math.hypot(nx, ny) || 1;
    left.push([P[i].x + nx / nl * w, P[i].y + ny / nl * w]);
    right.push([P[i].x - nx / nl * w, P[i].y - ny / nl * w]);
  }
  ctx.save();
  ctx.beginPath(); ctx.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  ctx.fillStyle = `rgba(112,85,42,${(.82 * aBase).toFixed(3)})`;
  ctx.fill();
  ctx.strokeStyle = `rgba(201,164,92,${(.55 * aBase).toFixed(3)})`;
  ctx.lineWidth = .8; ctx.stroke();
  ctx.restore();
}

/* 树干用一条有收分的实体金线，不再用平行细线拼成一根“杆” */
function strokeTrunk(P, r, aBase){
  const n = P.length, left = [], right = [];
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1);
    const wobble = 1 + .04 * Math.sin(i * .72 + 1.2) + .025 * Math.sin(i * 1.9) + .012 * Math.sin(i * 3.1);
    const w = Math.max(.35, r * P[i].f * 0.55 * (1 - .82 * t) * (1 + .24 * Math.exp(-i / 2.1)) * wobble);
    const j = Math.min(n - 1, i + 1), k = Math.max(0, i - 1);
    const nx = -(P[j].y - P[k].y), ny = P[j].x - P[k].x, nl = Math.hypot(nx, ny) || 1;
    left.push([P[i].x + nx / nl * w, P[i].y + ny / nl * w]);
    right.push([P[i].x - nx / nl * w, P[i].y - ny / nl * w]);
  }
  ctx.save();
  ctx.beginPath(); ctx.moveTo(left[0][0], left[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(left[i][0], left[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
  ctx.closePath();
  const mid = Math.floor(n * .55);
  const grad = ctx.createLinearGradient(left[mid][0], left[mid][1], right[mid][0], right[mid][1]);
  grad.addColorStop(0, `rgba(92,70,32,${(.78 * aBase).toFixed(3)})`);
  grad.addColorStop(.28, `rgba(201,164,92,${(.78 * aBase).toFixed(3)})`);
  grad.addColorStop(.52, `rgba(244,216,157,${(.9 * aBase).toFixed(3)})`);
  grad.addColorStop(.74, `rgba(201,164,92,${(.78 * aBase).toFixed(3)})`);
  grad.addColorStop(1, `rgba(92,70,32,${(.78 * aBase).toFixed(3)})`);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = `rgba(255,232,180,${(.42 * aBase).toFixed(3)})`;
  ctx.lineWidth = 1; ctx.stroke();
  // 两道低对比树皮沟壑，避免树干像一根光滑木梁
  for (let s = 0; s < 2; s++) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const w = Math.max(.35, r * P[i].f * 0.55 * (1 - .82 * t) * (1 + .24 * Math.exp(-i / 2.1)));
      const f = (s ? .32 : -.36) + .08 * Math.sin(i * .6 + s);
      const j = Math.min(n - 1, i + 1), k = Math.max(0, i - 1);
      const nx = -(P[j].y - P[k].y), ny = P[j].x - P[k].x, nl = Math.hypot(nx, ny) || 1;
      const x = P[i].x + nx / nl * w * f, y = P[i].y + ny / nl * w * f;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = `rgba(72,52,23,${(.28 * aBase).toFixed(3)})`;
    ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
}

let G = null, notes = null, nF = 0, playing = false, needGen = true;
let labels = [];

function draw(){
  const bg = ctx.createRadialGradient(W / 2, H * 0.55, 60, W / 2, H * 0.5, 660);
  bg.addColorStop(0, '#15100a'); bg.addColorStop(1, '#070503');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // 地面
  const g0 = project([0, 0, 0]);
  const gr = 2.4 * G.stats.S * g0.f;
  const gg = ctx.createRadialGradient(g0.x, g0.y, 0, g0.x, g0.y, gr);

  // 根
  G.roots.forEach((rt, i) => {
    const P = rt.pts.map(project);
    strokeRoot(P, rt.r, .7);
  });

  // 枝（按深度）
  const list = G.branches.map(b => {
    const P = b.pts.map(project);
    return {b, P, z: P.reduce((s, q) => s + q.z, 0) / P.length};
  }).sort((a, c) => c.z - a.z);

    if (len3(sub3(b.pts[b.pts.length - 1], b.pts[0])) < 1e-3) return;
    if (b.key === 'trunk') strokeTrunk(P, b.r, depthA(z));

  });
  // 枝梢不长成切口：末端加一枚收尖的芽，粗枝收细后再结束
  const hasChild = new Set(G.branches.filter(b => b.parent).map(b => b.parent));
  list.forEach(({b, P}) => {
    if (b.key === 'trunk' || hasChild.has(b.key)) return;
    const end = P[P.length - 1];
    const r = Math.max(1.2, b.r * end.f * .22);
    ctx.save();
    ctx.fillStyle = `rgba(255,230,170,${clamp(depthA(end.z), .3, .9)})`;
    ctx.beginPath(); ctx.ellipse(end.x, end.y, r, r * .58, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  // 叶簇光晕 + 叶
  const groups = new Map();
  G.leaves.forEach(l => {
    if (l.a <= 0) return;
    let g = groups.get(l.ck); if (!g) { g = {s: [0, 0, 0], n: 0, a: 0}; groups.set(l.ck, g); }
    g.s = add(g.s, l.p); g.n++; g.a += l.a;
  });
  const items = [];
  groups.forEach(g => {
    const c = project(mul(g.s, 1 / g.n));
    items.push({k: 'h', z: c.z, x: c.x, y: c.y, r: Math.min(0.75, 0.2 + 0.07 * Math.sqrt(g.n)) * c.f * 1.6, a: (g.a / g.n) * depthA(c.z)});
  });

    if (l.a <= 0) return;
    const pp = project(l.p);
    items.push({k: 'l', z: pp.z, x: pp.x, y: pp.y, r: Math.max(1.8, 0.082 * l.sz * pp.f), ang: l.ang, a: l.a * depthA(pp.z), l});

    } else {

      ctx.beginPath(); ctx.ellipse(0, 0, it.r * 1.6, it.r * .68, 0, 0, Math.PI * 2); ctx.fill();

  });

  // 悬浮到叶片时，给当前叶一个金色呼吸环，让点击目标有实体感
  if (hoverLeaf && hoverLeaf._sx != null) {

function drawLabels(){
  const SF = clamp(W / (cv.getBoundingClientRect().width || W), 1, 1.35);
  const by = new Map();
  G.leaves.forEach(l => {
    if (l.a <= 0.5) return;
    let g = by.get(l.nt.topic); if (!g) { g = {s: [0, 0, 0], n: 0}; by.set(l.nt.topic, g); }
    g.s = add(g.s, l.p); g.n++;
  });
  const CX = W / 2, CY = H * 0.46;
  const items = [];
  const minLabel = Math.max(2, Math.ceil(G.stats.N * 0.012));
  const ranked = [...by.entries()]
    .filter(([name, g]) => name !== '无正文' && g.n >= minLabel)
    .sort((a, b) => b[1].n - a[1].n)
    .slice(0, 12);
  ranked.forEach(([name, g]) => {
    const pp = project(mul(g.s, 1 / g.n));
    const dx = pp.x - CX, dy = pp.y - CY, d = Math.hypot(dx, dy) || 1;
    const x = pp.x + dx / d * 46 * SF, y = pp.y + dy / d * 30 * SF;
    items.push({name, n: g.n, ax: pp.x, ay: pp.y, z: pp.z, x, y, bx: x, by: y});
  });
  ctx.font = `600 ${11 * SF}px "PingFang SC","Hiragino Sans GB",sans-serif`;
  items.forEach(it => { it.w = ctx.measureText(it.name).width + 18 * SF; it.x = clamp(it.x, 50 * SF, W - 50 * SF); it.y = clamp(it.y, 70 * SF, H - 70 * SF); });
  for (let pass = 0; pass < 20; pass++)
    for (let a = 0; a < items.length; a++) for (let b = a + 1; b < items.length; b++) {
      const A = items[a], B = items[b];
      if (Math.abs(A.x - B.x) < (A.w + B.w) / 2 + 6 * SF && Math.abs(A.y - B.y) < 26 * SF) {
        const dir = A.y <= B.y ? -1 : 1, push = (26 * SF - Math.abs(A.y - B.y)) / 2 + .5;
        A.y = clamp(A.y + dir * push, 66 * SF, H - 66 * SF); B.y = clamp(B.y - dir * push, 66 * SF, H - 66 * SF);
      }
    }
  items.forEach(it => {
    const al = clamp(depthA(it.z) * 1.05, .35, 1);
    ctx.save();
    if (Math.hypot(it.x - it.bx, it.y - it.by) > 14) {
      ctx.strokeStyle = `rgba(201,164,92,${(.18 * al).toFixed(3)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(it.ax, it.ay); ctx.lineTo(it.x, it.y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(7,5,3,.58)';
    ctx.fillRect(it.x - it.w / 2 + 4 * SF, it.y - 9 * SF, it.w - 8 * SF, 20 * SF);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 5;
    ctx.fillStyle = `rgba(222,196,138,${(.92 * al).toFixed(3)})`;
    ctx.fillText(it.name, it.x, it.y);
    ctx.restore();
  });
}

function hideTip(){

  hoverLeaf = null;
  cv.style.cursor = drag ? 'grabbing' : 'grab';

function hover(e){
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / (r.width || W));
  const my = (e.clientY - r.top) * (H / (r.height || H));
  let best = null, bd = 12;
  G.leaves.forEach(l => {
    if (l._sx == null || l.a < .5) return;
    const d = Math.hypot(l._sx - mx, l._sy - my);
    if (d < bd) { bd = d; best = l; }
  });
  cv.style.cursor = best ? 'pointer' : (drag ? 'grabbing' : 'grab');
  if (!best) { hideTip(); return; }
  hoverLeaf = best;
  if (!tip) return;
  tip.textContent = '';
  const title = document.createElement('b');
  title.textContent = best.nt.topic || '博客';
  const sub = document.createElement('span');
  sub.textContent = `${best.nt.sub || ''}${best.nt.sub ? ' · ' : ''}${best.nt.date || ''}`;
  tip.append(title, sub);
  tip.style.left = `${e.clientX - r.left}px`;
  tip.style.top = `${e.clientY - r.top}px`;
  tip.classList.add('show');

function stripMarkdown(text){
  return String(text || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '[图片]')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/[*_`>]/g, '')
    .trim();
}

async function openReader(nt){
  if (!nt || !nt.entryId) return;
  if (tip) tip.classList.remove('show');
  hideTip();
  reader.classList.add('open');
  reader.setAttribute('aria-hidden', 'false');
  readerMeta.textContent = `${nt.date || ''} · ${nt.topic || ''}`;
  readerTitle.textContent = nt.sub || nt.topic || '博客';
  readerBody.textContent = '正在读取文章…';
  readerLink.href = `/blog#entry-${nt.entryId}`;
  try {
    let data;
    if (window.PREVIEW_ENTRIES && window.PREVIEW_ENTRIES[nt.entryId]) {
      data = { summary: window.PREVIEW_ENTRIES[nt.entryId], date: nt.date, tags: [] };
    } else {
      const res = await fetch(`/api/diaries/${encodeURIComponent(nt.entryId)}`, { headers: { accept: 'application/json' } });
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json();
    }
    readerMeta.textContent = `${data.date || nt.date || ''} · ${nt.topic || ''}`;
    readerBody.textContent = stripMarkdown(data.summary || data.content || '这篇文章没有正文。');
  } catch (err) {
    readerBody.textContent = '文章内容读取失败，请从博客页面打开。';
  }
}

function closeReader(){
  reader.classList.remove('open');
  reader.setAttribute('aria-hidden', 'true');
}

function pickLeaf(e){
  if (!G || !G.leaves || !G.leaves.length) return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / (r.width || W));
  const my = (e.clientY - r.top) * (H / (r.height || H));

  G.leaves.forEach(l => {
    if (l._sx == null || l.a < .5) return;
    const d = Math.hypot(l._sx - mx, l._sy - my);
    if (d < bd) { bd = d; best = l; }
  });
  if (best) openReader(best.nt);
}

  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (auto && !drag) cam.yaw += dt * rad(3);

    nF = Math.min(notes.length, nF + dt * notes.length / 10);     // 10 秒长完

  }
  if (needGen) regen();
  view.v += (view.target - view.v) * Math.min(1, dt * 3);
  draw();
  requestAnimationFrame(tick);
}
